[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mediaserver"
dynamic = ["version"]
description = "Home media server tooling: torrent scraper for qBittorrent and AI-powered movie/TV organizer for Jellyfin."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "beautifulsoup4>=4.12",
    "curl_cffi>=0.11",
    "Flask>=3.0",
    "playwright>=1.40",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mediaserver-scraper = "mediaserver.scraper:main"
mediaserver-organize = "mediaserver.organizer:main"
mediaserver-add = "mediaserver.client:main"

[tool.setuptools.dynamic]
version = { attr = "mediaserver.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
